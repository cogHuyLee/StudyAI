{% extends "base.html" %}
{% block title %}Đổi mật khẩu – StudyAI{% endblock %}
{% block content %}
<div class="page-title"><i class="bi bi-key"></i> Đổi mật khẩu</div>

<div class="row justify-content-center">
  <div class="col-md-6">
    <form method="post" class="card card-body">
      <div class="mb-3">
        <label class="form-label fw-medium">Mật khẩu hiện tại *</label>
        <input name="current_password" type="password" class="form-control" required autocomplete="current-password">
      </div>
      <div class="mb-3">
        <label class="form-label fw-medium">Mật khẩu mới * (tối thiểu 6 ký tự)</label>
        <input name="new_password" type="password" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label class="form-label fw-medium">Xác nhận mật khẩu mới *</label>
        <input name="confirm_password" type="password" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary">Đổi mật khẩu</button>
        <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Huỷ</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
