{% extends "base.html" %}
{% block title %}Đăng nhập – StudyAI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-header">
      <div style="font-size:2rem;margin-bottom:.4rem">📚</div>
      <h4>StudyAI</h4>
      <div class="small opacity-75 mt-1">Trợ lý học tập thông minh</div>
    </div>
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-medium">Tên đăng nhập hoặc Email</label>
          <input name="username" class="form-control" required autofocus placeholder="Tên đăng nhập">
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Mật khẩu</label>
          <input name="password" type="password" class="form-control" required placeholder="••••••">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
        </div>
        <button class="btn btn-primary w-100 py-2">Đăng nhập</button>
      </form>
      <p class="mt-3 mb-0 text-center text-muted small">
        Chưa có tài khoản? <a href="{{ url_for('register') }}" class="fw-medium">Đăng ký</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
