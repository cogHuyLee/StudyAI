{% extends "base.html" %}
{% block title %}Đăng ký – StudyAI{% endblock %}
{% block content %}
<div class="auth-wrap" style="align-items:flex-start;padding-top:1.5rem;padding-bottom:2rem">
  <div class="card auth-card" style="max-width:640px">
    <div class="auth-header">
      <div style="font-size:2rem;margin-bottom:.4rem">📚</div>
      <h4>Tạo tài khoản StudyAI</h4>
      <div class="small opacity-75 mt-1">Điền thông tin để bắt đầu</div>
    </div>
    <div class="card-body">
      <form method="post" class="row g-3">
        <div class="col-12"><div class="fw-semibold text-primary small text-uppercase">Tài khoản</div></div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Tên đăng nhập *</label>
          <input name="username" class="form-control" required autofocus>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Email *</label>
          <input name="email" type="email" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Mật khẩu * (tối thiểu 6 ký tự)</label>
          <input name="password" type="password" class="form-control" required minlength="6">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Họ và tên</label>
          <input name="full_name" class="form-control">
        </div>

        <div class="col-12"><hr class="my-1"><div class="fw-semibold text-primary small text-uppercase">Thông tin cá nhân</div></div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Số điện thoại</label>
          <input name="phone" class="form-control" placeholder="09xx...">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Ngày sinh</label>
          <input name="birth_date" type="date" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">MSSV</label>
          <input name="student_id" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Trường</label>
          <input name="school" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-medium">Ngành</label>
          <input name="major" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-medium">Lớp</label>
          <input name="class_name" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Địa chỉ</label>
          <input name="address" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Giới thiệu ngắn</label>
          <textarea name="bio" class="form-control" rows="2" maxlength="300"></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary w-100 py-2">Đăng ký</button>
        </div>
      </form>
      <p class="mt-3 mb-0 text-center text-muted small">
        Đã có tài khoản? <a href="{{ url_for('login') }}" class="fw-medium">Đăng nhập</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
